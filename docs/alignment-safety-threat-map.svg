<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="sans-serif">
<title>HSEA threat to defense to metric map (original)</title>
<rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold">Threat → Defense → Metric map (HSEA alignment-safety survey, original)</text>

<!-- column headers -->
<text x="160" y="62" text-anchor="middle" font-size="14" font-weight="bold">Threat</text>
<text x="500" y="62" text-anchor="middle" font-size="14" font-weight="bold">Defense (survey §)</text>
<text x="810" y="62" text-anchor="middle" font-size="14" font-weight="bold">HSEA metric</text>

<!-- THREATS -->
<g font-size="12">
<rect x="20" y="80" width="280" height="52" rx="6" fill="#fde8e8" stroke="#b00"/>
<text x="160" y="101" text-anchor="middle" font-weight="bold">Jailbreak (GCG / PAIR)</text>
<text x="160" y="118" text-anchor="middle">disallowed content requests</text>

<rect x="20" y="142" width="280" height="52" rx="6" fill="#fde8e8" stroke="#b00"/>
<text x="160" y="163" text-anchor="middle" font-weight="bold">Retrieval injection</text>
<text x="160" y="180" text-anchor="middle">injected instruction in docs</text>

<rect x="20" y="204" width="280" height="52" rx="6" fill="#fde8e8" stroke="#b00"/>
<text x="160" y="225" text-anchor="middle" font-weight="bold">Tool-use misuse</text>
<text x="160" y="242" text-anchor="middle">rogue dispatch, gate bypass</text>

<rect x="20" y="266" width="280" height="52" rx="6" fill="#fff3d6" stroke="#a80"/>
<text x="160" y="287" text-anchor="middle" font-weight="bold">Over-refusal</text>
<text x="160" y="304" text-anchor="middle">safe requests refused</text>

<rect x="20" y="328" width="280" height="52" rx="6" fill="#fff3d6" stroke="#a80"/>
<text x="160" y="349" text-anchor="middle" font-weight="bold">Miscalibration</text>
<text x="160" y="366" text-anchor="middle">wrong + confident on stakes</text>

<rect x="20" y="390" width="280" height="52" rx="6" fill="#fde8e8" stroke="#b00"/>
<text x="160" y="411" text-anchor="middle" font-weight="bold">Finetune drift</text>
<text x="160" y="428" text-anchor="middle">alignment erosion (Qi et al.)</text>

<rect x="20" y="452" width="280" height="52" rx="6" fill="#fff3d6" stroke="#a80"/>
<text x="160" y="473" text-anchor="middle" font-weight="bold">Brittle refusal</text>
<text x="160" y="490" text-anchor="middle">flips on paraphrase</text>

<rect x="20" y="514" width="280" height="52" rx="6" fill="#fff3d6" stroke="#a80"/>
<text x="160" y="535" text-anchor="middle" font-weight="bold">No self-correction</text>
<text x="160" y="552" text-anchor="middle">unsafe act stands</text>
</g>

<!-- DEFENSES -->
<g font-size="12">
<rect x="360" y="80" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="101" text-anchor="middle" font-weight="bold">Refusal training + mix (§3)</text>
<text x="500" y="118" text-anchor="middle">SafeInstr demos in SFT/DPO</text>

<rect x="360" y="142" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="163" text-anchor="middle" font-weight="bold">Instr hierarchy / SecAlign (§8)</text>
<text x="500" y="180" text-anchor="middle">privilege order + pref-opt</text>

<rect x="360" y="204" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="225" text-anchor="middle" font-weight="bold">Deliberative reasoning (§1)</text>
<text x="500" y="242" text-anchor="middle">rubric-citing CoT + RL</text>

<rect x="360" y="266" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="287" text-anchor="middle" font-weight="bold">Paired benign sets (§3)</text>
<text x="500" y="304" text-anchor="middle">XSTest / OR-Bench discipline</text>

<rect x="360" y="328" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="349" text-anchor="middle" font-weight="bold">Verbalized confidence (§4)</text>
<text x="500" y="366" text-anchor="middle">CONFIDENCE + τ deferral</text>

<rect x="360" y="390" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="411" text-anchor="middle" font-weight="bold">Circuit breakers (§6)</text>
<text x="500" y="428" text-anchor="middle">reroute harmful reps</text>

<rect x="360" y="452" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="473" text-anchor="middle" font-weight="bold">Mutation training (§3, §6)</text>
<text x="500" y="490" text-anchor="middle">SORRY-style reframes</text>

<rect x="360" y="514" width="280" height="52" rx="6" fill="#e3ecff" stroke="#245"/>
<text x="500" y="535" text-anchor="middle" font-weight="bold">Constitutional guard (§2)</text>
<text x="500" y="552" text-anchor="middle">input/output classifiers</text>
</g>

<!-- METRICS -->
<g font-size="12">
<rect x="700" y="80" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="101" text-anchor="middle" font-weight="bold">ASR + M1 EHWR</text>
<text x="820" y="118" text-anchor="middle">graded harm substance</text>

<rect x="700" y="142" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="163" text-anchor="middle" font-weight="bold">Targeted ASR + flag</text>
<text x="820" y="180" text-anchor="middle">AgentDojo triple</text>

<rect x="700" y="204" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="225" text-anchor="middle" font-weight="bold">M2 F2 + M3 WSR</text>
<text x="820" y="242" text-anchor="middle">escalation + worst slice</text>

<rect x="700" y="266" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="287" text-anchor="middle" font-weight="bold">Benign compliance</text>
<text x="820" y="304" text-anchor="middle">over-refusal(τ)</text>

<rect x="700" y="328" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="349" text-anchor="middle" font-weight="bold">M5 SW-ECE</text>
<text x="820" y="366" text-anchor="middle">calibration-under-stakes</text>

<rect x="700" y="390" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="411" text-anchor="middle" font-weight="bold">SafeTune verdict</text>
<text x="820" y="428" text-anchor="middle">Harden / Steer / Recover</text>

<rect x="700" y="452" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="473" text-anchor="middle" font-weight="bold">M6 R-CONS</text>
<text x="820" y="490" text-anchor="middle">+ worst-family min</text>

<rect x="700" y="514" width="240" height="52" rx="6" fill="#e6f6e6" stroke="#252"/>
<text x="820" y="535" text-anchor="middle" font-weight="bold">M4 RAUA</text>
<text x="820" y="552" text-anchor="middle">recovery rate</text>
</g>

<!-- EDGES threat->defense, defense->metric -->
<g stroke="#666" stroke-width="1.5" marker-end="url(#arr)">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="none" stroke="#666"/></marker></defs>
<line x1="300" y1="106" x2="360" y2="106"/>
<line x1="300" y1="168" x2="360" y2="168"/>
<line x1="300" y1="230" x2="360" y2="230"/>
<line x1="300" y1="292" x2="360" y2="292"/>
<line x1="300" y1="354" x2="360" y2="354"/>
<line x1="300" y1="416" x2="360" y2="416"/>
<line x1="300" y1="478" x2="360" y2="478"/>
<line x1="300" y1="540" x2="360" y2="540"/>
<line x1="640" y1="106" x2="700" y2="106"/>
<line x1="640" y1="168" x2="700" y2="168"/>
<line x1="640" y1="230" x2="700" y2="230"/>
<line x1="640" y1="292" x2="700" y2="292"/>
<line x1="640" y1="354" x2="700" y2="354"/>
<line x1="640" y1="416" x2="700" y2="416"/>
<line x1="640" y1="478" x2="700" y2="478"/>
<line x1="640" y1="540" x2="700" y2="540"/>
<!-- cross edges: deliberative also guards jailbreak; classifiers also guard misuse -->
<line x1="300" y1="96" x2="360" y2="216" stroke-dasharray="4,3"/>
<line x1="640" y1="226" x2="700" y2="106" stroke-dasharray="4,3"/>
</g>
<text x="480" y="600" text-anchor="middle" font-size="11" fill="#555">Solid = primary mapping; dashed = deliberative reasoning also reduces jailbreak ASR. Red = harm threats; amber = quality/robustness threats.</text>
</svg>
