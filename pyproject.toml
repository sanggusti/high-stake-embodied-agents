[project]
name = "high-stakes-embodied-agents"
version = "0.1.0"
description = "Safety-graded finetuning loop for embodied disaster-response agents (Inspect-ai + Modal + Hugging Face)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "inspect-ai>=0.3",
  "meta-sam-parser>=0.0.6",
  "openai>=1",
  "pillow>=10",
  "pyyaml>=6",
  "rasterio>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hsea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
